    <polygon points="512,280 592,420 432,420" fill="#ede9fe"/>
    <polygon points="672,280 800,420 592,420" fill="url(#b)"/>
    <polygon points="224,420 432,420 512,800" fill="url(#b)"/>
    <polygon points="432,420 592,420 512,800" fill="url(#c)"/>
    <polygon points="592,420 800,420 512,800" fill="url(#d)"/>
